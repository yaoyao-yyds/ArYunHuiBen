<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR绘本 - 稳定版</title>

    <!-- 引入 A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.0/dist/aframe-master.min.js"></script>
    <!-- 引入 A-Frame Extras (用于 animation-mixer) -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <!-- 引入 AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }

        /* 顶部状态栏 */
        #status {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #fff;
            padding: 10px 20px; border-radius: 20px; font-size: 14px;
            z-index: 999; pointer-events: none;
            transition: all 0.3s;
            white-space: nowrap;
        }
        #status.found { background: rgba(40, 167, 69, 0.9); }

        /* 底部控制面板 */
        #controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 25px;
            display: flex; gap: 12px; z-index: 999;
            backdrop-filter: blur(10px);
        }
        .btn {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.2); color: #fff; font-size: 20px;
            cursor: pointer; touch-action: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:active { 
            background: rgba(255,255,255,0.5);
            transform: scale(0.95);
        }
        
        /* 动画播放指示器 */
        .btn.playing {
            background: rgba(76, 175, 80, 0.6);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
        }
        
        /* 提示文字 */
        .hint {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.7); font-size: 13px;
            pointer-events: none; z-index: 999; text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 15px;
            line-height: 1.6;
        }
        
        /* 加载提示 */
        #loading {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; z-index: 9999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { font-size: 16px; margin-bottom: 10px; }
        #loading-progress { font-size: 12px; opacity: 0.8; }
    </style>
</head>
<body>
    <!-- 加载提示 -->
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">正在初始化AR环境...</div>
        <div id="loading-progress">请稍候</div>
    </div>

    <div id="status">准备就绪</div>
    <div class="hint">
        👆 点击模型播放动画<br>
        👌 双指捏合缩放 | 双指旋转<br>
        👆 单指滑动360°旋转模型
    </div>

    <div id="controls">
        <button class="btn" id="btn-zoom-in" title="放大">+</button>
        <button class="btn" id="btn-zoom-out" title="缩小">−</button>
        <button class="btn" id="btn-rotate-left" title="左旋转">↺</button>
        <button class="btn" id="btn-rotate-right" title="右旋转">↻</button>
        <button class="btn" id="anim-btn" title="播放动画">▶</button>
        <button class="btn" id="btn-reset" title="重置">⟲</button>
    </div>

    <!-- A-Frame 场景 -->
    <!-- 关键修改：添加 loading-screen="enabled: false" 禁用A-Frame默认加载界面 -->
    <!-- 添加 timeout="30000" 设置资源加载超时 -->
    <a-scene
        embedded
        loading-screen="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
    >
        <!-- 资源定义 -->
        <!-- 关键修改：添加 timeout 防止资源加载卡死 -->
        <a-assets timeout="10000">
            <a-asset-item 
                id="model-asset" 
                src="https://img.xiaotianfx.cn/3d/book1.glb"
                preload="auto"
            ></a-asset-item>
            <video 
                id="ar-video"
                src="https://img.xiaotianfx.cn/miyun/sp1.mp4"
                preload="auto"
                loop 
                crossorigin="anonymous" 
                playsinline
            ></video>
        </a-assets>

        <!-- Hiro 标记识别 -->
        <a-marker preset="hiro" id="ar-marker">
            
            <!-- 1. 3D模型容器 -->
            <a-entity id="model-wrapper" position="0 0 0" scale="0.5 0.5 0.5">
                <a-entity
                    id="model"
                    gltf-model="#model-asset"
                    position="0 0.5 0"
                    class="clickable"
                    animation-mixer="clip: *; loop: repeat; timeScale: 0"
                    click-handler
                ></a-entity>
            </a-entity>

            <!-- 2. 视频平面 -->
            <a-video
                src="#ar-video"
                position="0 0.5 -1"
                rotation="0 0 0"
                width="1.6"
                height="0.9"
                opacity="0.9"
            ></a-video>

        </a-marker>

        <!-- 相机 -->
        <a-entity camera>
            <a-entity cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable"></a-entity>
        </a-entity>
    </a-scene>

    <script>
        // ============================================
        // 全局变量（先声明）
        // ============================================
        const state = { 
            scale: 0.5, 
            rotationY: 0,
            rotationX: 0,
            isPlaying: false,
            isMarkerFound: false,
            modelLoaded: false,
            initialized: false,
            mixer: null
        };
        
        // 注册自定义点击组件
        AFRAME.registerComponent('click-handler', {
            init: function () {
                this.el.addEventListener('click', function (evt) {
                    console.log('🎯 模型被点击了 (click-handler)');
                    evt.stopPropagation();
                    toggleAnim();
                });
                
                this.el.addEventListener('mousedown', function (evt) {
                    console.log('🎯 模型被按下 (click-handler)');
                    evt.stopPropagation();
                    toggleAnim();
                });
            },
            tick: function (time, timeDelta) {
                // 如果使用了备用mixer，需要在这里更新它
                if (state.mixer && state.isPlaying) {
                    state.mixer.update(timeDelta / 1000);
                }
            }
        });
        
        const elements = {};
        
        const touch = {
            startDistance: 0,
            startAngle: 0,
            lastScale: 0.5,
            lastRotationY: 0,
            startX: 0,
            startY: 0,
            isMoving: false
        };

        // ============================================
        // 1. 页面加载后立即初始化（不等待场景）
        // ============================================
        window.addEventListener('load', function() {
            console.log('✅ Window loaded');
            
            // 直接获取元素（不等待A-Frame）
            elements.modelWrapper = document.getElementById('model-wrapper');
            elements.model = document.getElementById('model');
            elements.video = document.getElementById('ar-video');
            elements.status = document.getElementById('status');
            elements.marker = document.getElementById('ar-marker');
            elements.animBtn = document.getElementById('anim-btn');
            elements.loading = document.getElementById('loading');
            elements.loadingText = document.getElementById('loading-text');
            elements.loadingProgress = document.getElementById('loading-progress');
            
            // 立即绑定事件
            setupButtonEvents();
            setupTouchGestures();
            
            // 延迟检查场景状态
            setTimeout(checkSceneStatus, 100);
        });

        // ============================================
        // 2. 场景状态检查（轮询方式）
        // ============================================
        function checkSceneStatus() {
            const scene = document.querySelector('a-scene');
            
            if (!scene) {
                updateLoadingProgress('等待场景初始化...');
                setTimeout(checkSceneStatus, 100);
                return;
            }
            
            console.log('场景状态:', {
                hasLoaded: scene.hasLoaded,
                isLoading: scene.isLoading
            });
            
            if (scene.hasLoaded || !scene.isLoading) {
                // 场景已加载或不在加载中
                initScene();
            } else {
                // 继续等待
                updateLoadingProgress('正在加载AR组件...');
                setTimeout(checkSceneStatus, 100);
            }
        }

        // ============================================
        // 3. 初始化场景
        // ============================================
        function initScene() {
            if (state.initialized) return;
            state.initialized = true;
            
            console.log('✅ 初始化场景');
            updateLoadingProgress('AR环境就绪');
            
            // 绑定标记事件
            setupMarkerEvents();
            
            // 绑定模型事件
            setupModelEvents();
            
            // 隐藏加载界面（延迟一下确保用户能看到）
            setTimeout(hideLoading, 500);
        }

        function updateLoadingProgress(text) {
            if (elements.loadingProgress) {
                elements.loadingProgress.textContent = text;
            }
        }

        function hideLoading() {
            if (elements.loading) {
                elements.loading.classList.add('hidden');
            }
            console.log('✅ 加载界面已隐藏');
        }

        // ============================================
        // 4. 强制隐藏加载界面（10秒超时）
        // ============================================
        setTimeout(function() {
            if (!state.initialized) {
                console.warn('⚠️ 初始化超时，强制启动');
                state.initialized = true;
                hideLoading();
                
                // 尝试初始化
                if (elements.model) setupModelEvents();
                if (elements.marker) setupMarkerEvents();
            }
        }, 10000);

        // ============================================
        // 5. 模型事件
        // ============================================
        function setupModelEvents() {
            if (!elements.model) return;
            
            console.log('绑定模型事件');
            
            // 模型加载完成
            elements.model.addEventListener('model-loaded', function(e) {
                console.log('✅ 模型加载完成');
                state.modelLoaded = true;
                
                const mesh = elements.model.getObject3D('mesh');
                if (mesh && mesh.animations && mesh.animations.length > 0) {
                    console.log('📋 动画数量:', mesh.animations.length);
                    updateStatus('✓ 模型已加载，点击播放动画');
                } else {
                    console.warn('⚠️ 模型无动画');
                    updateStatus('⚠️ 模型无动画数据');
                }
            });
            
            // 模型加载失败
            elements.model.addEventListener('model-error', function(e) {
                console.error('❌ 模型加载失败');
                updateStatus('❌ 模型加载失败');
            });
        }

        // ============================================
        // 6. 标记识别事件
        // ============================================
        function setupMarkerEvents() {
            if (!elements.marker) return;
            
            console.log('绑定标记事件');
            
            elements.marker.addEventListener('markerFound', () => {
                console.log('✅ 标记已识别');
                state.isMarkerFound = true;
                updateStatus('✓ 识别成功！点击模型播放动画', true);
                
                if (elements.video) {
                    elements.video.play().catch(e => {
                        console.log('视频播放:', e.message);
                    });
                }
            });

            elements.marker.addEventListener('markerLost', () => {
                console.log('❌ 标记丢失');
                state.isMarkerFound = false;
                updateStatus('请将摄像头对准识别图', false);
                
                if (elements.video) {
                    elements.video.pause();
                }
            });
        }

        // ============================================
        // 7. 按钮事件
        // ============================================
        function setupButtonEvents() {
            console.log('绑定按钮事件');
            
            document.getElementById('btn-zoom-in')?.addEventListener('click', () => adjustScale(0.1));
            document.getElementById('btn-zoom-out')?.addEventListener('click', () => adjustScale(-0.1));
            document.getElementById('btn-rotate-left')?.addEventListener('click', () => adjustRotation(-45));
            document.getElementById('btn-rotate-right')?.addEventListener('click', () => adjustRotation(45));
            document.getElementById('anim-btn')?.addEventListener('click', toggleAnim);
            document.getElementById('btn-reset')?.addEventListener('click', resetModel);
        }

        // ============================================
        // 8. 触摸手势
        // ============================================
        function setupTouchGestures() {
            console.log('绑定触摸手势');
            
            document.addEventListener('touchstart', handleTouchStart, { passive: false });
            document.addEventListener('touchmove', handleTouchMove, { passive: false });
            document.addEventListener('touchend', handleTouchEnd, { passive: false });
        }

        function handleTouchStart(e) {
            if (!state.isMarkerFound) return;
            
            if (e.touches.length === 1) {
                touch.startX = e.touches[0].clientX;
                touch.startY = e.touches[0].clientY;
                touch.isMoving = false;
            } else if (e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touch.startDistance = Math.sqrt(dx * dx + dy * dy);
                touch.startAngle = Math.atan2(dy, dx);
                touch.lastScale = state.scale;
                touch.lastRotationY = state.rotationY;
            }
        }

        function handleTouchMove(e) {
            if (!state.isMarkerFound) return;
            
            if (e.touches.length === 1) {
                e.preventDefault();
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;
                const deltaX = currentX - touch.startX;
                const deltaY = currentY - touch.startY;
                
                if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
                    touch.isMoving = true;
                    state.rotationY += deltaX * 0.5;
                    updateTransform();
                    touch.startX = currentX;
                    touch.startY = currentY;
                }
            } else if (e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                
                // 缩放
                const currentDistance = Math.sqrt(dx * dx + dy * dy);
                const scaleRatio = currentDistance / touch.startDistance;
                state.scale = Math.max(0.1, Math.min(2, touch.lastScale * scaleRatio));
                
                // 旋转
                let angleDelta = Math.atan2(dy, dx) - touch.startAngle;
                if (angleDelta > Math.PI) angleDelta -= 2 * Math.PI;
                if (angleDelta < -Math.PI) angleDelta += 2 * Math.PI;
                state.rotationY = touch.lastRotationY + angleDelta * (180 / Math.PI) * 2;
                
                updateTransform();
            }
        }

        function handleTouchEnd(e) {
            if (e.touches.length === 0) {
                touch.isMoving = false;
            }
        }

        // ============================================
        // 9. 辅助函数
        // ============================================
        function updateStatus(text, found = false) {
            if (elements.status) {
                elements.status.textContent = text;
                elements.status.classList.toggle('found', found);
            }
        }

        function adjustScale(delta) {
            if (!state.isMarkerFound) return;
            state.scale = Math.max(0.1, Math.min(2, state.scale + delta));
            updateTransform();
        }

        function adjustRotation(delta) {
            if (!state.isMarkerFound) return;
            state.rotationY += delta;
            updateTransform();
        }

        function updateTransform() {
            if (elements.modelWrapper) {
                elements.modelWrapper.setAttribute('scale', 
                    `${state.scale} ${state.scale} ${state.scale}`);
                elements.modelWrapper.setAttribute('rotation', 
                    `${state.rotationX} ${state.rotationY} 0`);
            }
        }

        function toggleAnim() {
            if (!state.modelLoaded) {
                updateStatus('⏳ 模型加载中...');
                return;
            }
            
            state.isPlaying = !state.isPlaying;
            
            if (elements.model) {
                // 使用 aframe-extras 的 animation-mixer
                elements.model.setAttribute('animation-mixer', {
                    clip: '*',
                    loop: 'repeat',
                    timeScale: state.isPlaying ? 1 : 0,
                    crossFadeDuration: 0.3
                });
                
                // 备用方案：直接操作 Three.js 的 AnimationMixer
                const mesh = elements.model.getObject3D('mesh');
                if (mesh && mesh.animations && mesh.animations.length > 0) {
                    // 如果组件没有自动创建mixer，我们手动处理
                    if (!elements.model.components['animation-mixer']) {
                        if (!state.mixer) {
                            state.mixer = new THREE.AnimationMixer(mesh);
                            // 播放所有动画
                            mesh.animations.forEach((clip) => {
                                const action = state.mixer.clipAction(clip);
                                action.play();
                            });
                        }
                        state.mixer.timeScale = state.isPlaying ? 1 : 0;
                    }
                }
            }
            
            if (elements.animBtn) {
                elements.animBtn.textContent = state.isPlaying ? '⏸' : '▶';
                elements.animBtn.classList.toggle('playing', state.isPlaying);
            }
            
            updateStatus(state.isPlaying ? '▶ 动画播放中...' : '⏸ 动画已暂停');
        }

        function resetModel() {
            state.scale = 0.5;
            state.rotationY = 0;
            state.rotationX = 0;
            state.isPlaying = false;
            
            updateTransform();
            
            if (elements.model) {
                elements.model.setAttribute('animation-mixer', { timeScale: 0 });
                
                // 重置备用mixer
                if (state.mixer) {
                    state.mixer.timeScale = 0;
                    state.mixer.stopAllAction();
                }
            }
            
            if (elements.animBtn) {
                elements.animBtn.textContent = '▶';
                elements.animBtn.classList.remove('playing');
            }
            
            updateStatus('⟲ 模型已重置');
        }

        // ============================================
        // 10. 调试信息
        // ============================================
        console.log('🎮 AR绘本脚本已加载');
    </script>
</body>
</html>
