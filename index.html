<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR绘本 - 完整交互版</title>

    <!-- 引入 A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.0/dist/aframe-master.min.js"></script>
    <!-- 引入 AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }

        /* 顶部状态栏 */
        #status {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #fff;
            padding: 8px 16px; border-radius: 20px; font-size: 14px;
            z-index: 999; pointer-events: none;
            transition: background 0.3s;
        }
        #status.found { background: rgba(40, 167, 69, 0.9); }

        /* 底部控制面板 */
        #controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 20px;
            display: flex; gap: 10px; z-index: 999;
        }
        .btn {
            width: 45px; height: 45px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.2); color: #fff; font-size: 18px;
            cursor: pointer; touch-action: none;
            transition: all 0.2s;
        }
        .btn:active { 
            background: rgba(255,255,255,0.5);
            transform: scale(0.95);
        }
        
        /* 动画播放指示器 */
        .btn.playing {
            background: rgba(76, 175, 80, 0.6);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
        }
        
        /* 提示文字 */
        .hint {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.6); font-size: 12px;
            pointer-events: none; z-index: 999; text-align: center;
        }
    </style>
</head>
<body>
    <div id="status">请将摄像头对准识别图</div>
    <div class="hint">👆 点击模型播放动画<br>👌 双指捏合缩放 | 双指旋转</div>

    <div id="controls">
        <button class="btn" onclick="adjustScale(0.1)">+</button>
        <button class="btn" onclick="adjustScale(-0.1)">−</button>
        <button class="btn" onclick="adjustRotation(30)">↻</button>
        <button class="btn" id="anim-btn" onclick="toggleAnim()">▶</button>
        <button class="btn" onclick="resetModel()">⟲</button>
    </div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
    >
        <a-assets>
            <a-asset-item id="model-asset" src="https://img.xiaotianfx.cn/3d/book1.glb"></a-asset-item>
            <video id="ar-video"
                   src="https://img.xiaotianfx.cn/miyun/sp1.mp4"
                   loop crossorigin="anonymous" playsinline></video>
        </a-assets>

        <a-marker preset="hiro" id="ar-marker">
            
            <!-- 1. 3D模型容器 -->
            <a-entity id="model-wrapper" position="0 0 0" scale="0.5 0.5 0.5">
                <a-entity
                    id="model"
                    gltf-model="#model-asset"
                    position="0 0.5 0"
                    class="clickable"
                    animation-mixer="clip: *; loop: repeat; timeScale: 0"
                    cursor-listener
                ></a-entity>
            </a-entity>

            <!-- 2. 视频平面 (修改重点在这里) -->
            <a-video
                src="#ar-video"
                position="0 0.5 -1"      <!-- Z轴设为-1，让视频退到模型后方 -->
                rotation="0 0 0"        <!-- 保持竖直 -->
                width="1.6"
                height="0.9"
                opacity="0.9"
            ></a-video>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // === 注册A-Frame组件:点击监听器 ===
        AFRAME.registerComponent('cursor-listener', {
            init: function () {
                this.el.addEventListener('click', function (evt) {
                    console.log('模型被点击了!');
                    toggleAnim();
                });
                // 同时监听mousedown以增加兼容性
                this.el.addEventListener('mousedown', function (evt) {
                    console.log('模型被按下!');
                    toggleAnim();
                });
            }
        });

        // === 状态管理 ===
        const state = { 
            scale: 0.5, 
            rotation: 0, 
            isPlaying: false,
            isMarkerFound: false 
        };
        
        // === 获取DOM元素 ===
        let modelWrapper, model, video, status, marker, animBtn;
        
        // === 触摸手势变量 ===
        let touchStartDistance = 0;
        let touchStartRotation = 0;
        let lastScale = 0.5;
        let lastRotation = 0;

        // === 等待场景加载完成 ===
        document.addEventListener('DOMContentLoaded', function() {
            const scene = document.querySelector('a-scene');
            
            scene.addEventListener('loaded', function() {
                console.log('A-Frame场景已加载');
                
                // 获取DOM元素
                modelWrapper = document.getElementById('model-wrapper');
                model = document.getElementById('model');
                video = document.getElementById('ar-video');
                status = document.getElementById('status');
                marker = document.getElementById('ar-marker');
                animBtn = document.getElementById('anim-btn');
                
                // 绑定标记识别事件
                setupMarkerEvents();
            });
        });

        function setupMarkerEvents() {
            if (!marker) return;

            // === 1. 标记识别事件 ===
            marker.addEventListener('markerFound', () => {
                state.isMarkerFound = true;
                status.textContent = '✓ 识别成功! 点击模型查看动画';
                status.classList.add('found');
                video.play().catch(() => {});
            });

            marker.addEventListener('markerLost', () => {
                state.isMarkerFound = false;
                status.textContent = '请将摄像头对准识别图';
                status.classList.remove('found');
                video.pause();
            });
        }

        // === 2. 按钮控制 ===
        function adjustScale(delta) {
            if (!modelWrapper) {
                console.warn('modelWrapper未加载');
                return;
            }
            state.scale = Math.min(2, Math.max(0.1, state.scale + delta));
            updateTransform();
            console.log('缩放:', state.scale);
        }

        function adjustRotation(delta) {
            if (!modelWrapper) {
                console.warn('modelWrapper未加载');
                return;
            }
            state.rotation += delta;
            updateTransform();
            console.log('旋转:', state.rotation);
        }

        function updateTransform() {
            if (!modelWrapper) return;
            modelWrapper.setAttribute('scale', `${state.scale} ${state.scale} ${state.scale}`);
            modelWrapper.setAttribute('rotation', `0 ${state.rotation} 0`);
        }

        // === 3. 动画控制(优化后) ===
        function toggleAnim() {
            console.log('toggleAnim被调用, isMarkerFound:', state.isMarkerFound);
            
            if (!model || !animBtn) {
                console.warn('model或animBtn未加载');
                return;
            }
            
            if (!state.isMarkerFound) {
                if (status) status.textContent = '⚠️ 请先识别标记图';
                console.warn('标记未识别');
                return;
            }
            
            state.isPlaying = !state.isPlaying;
            console.log('动画状态:', state.isPlaying ? '播放' : '暂停');
            
            // 更新动画播放速度
            model.setAttribute('animation-mixer', {
                clip: '*',
                loop: 'repeat',
                timeScale: state.isPlaying ? 1 : 0
            });
            
            // 更新按钮状态
            animBtn.textContent = state.isPlaying ? '⏸' : '▶';
            animBtn.classList.toggle('playing', state.isPlaying);
            
            // 更新状态提示
            if (status) status.textContent = state.isPlaying ? '▶ 动画播放中...' : '⏸ 动画已暂停';
        }

        function resetModel() {
            if (!model || !modelWrapper || !animBtn) {
                console.warn('元素未加载');
                return;
            }
            
            state.scale = 0.5;
            state.rotation = 0;
            state.isPlaying = false;
            
            updateTransform();
            
            model.setAttribute('animation-mixer', {
                clip: '*',
                loop: 'repeat',
                timeScale: 0
            });
            
            animBtn.textContent = '▶';
            animBtn.classList.remove('playing');
            if (status) status.textContent = '⟲ 已重置模型';
            console.log('模型已重置');
        }


        // === 4. 触摸手势控制(重写优化) ===
        document.addEventListener('touchstart', (e) => {
            if (!state.isMarkerFound || e.touches.length !== 2) return;
            
            e.preventDefault();
            
            const touch1 = e.touches[0];
            const touch2 = e.touches[1];
            
            // 计算初始距离和角度
            const dx = touch1.clientX - touch2.clientX;
            const dy = touch1.clientY - touch2.clientY;
            
            touchStartDistance = Math.sqrt(dx * dx + dy * dy);
            touchStartRotation = Math.atan2(dy, dx);
            
            lastScale = state.scale;
            lastRotation = state.rotation;
            
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (!state.isMarkerFound || e.touches.length !== 2) return;
            
            e.preventDefault();
            
            const touch1 = e.touches[0];
            const touch2 = e.touches[1];
            
            const dx = touch1.clientX - touch2.clientX;
            const dy = touch1.clientY - touch2.clientY;
            
            // 计算当前距离和角度
            const currentDistance = Math.sqrt(dx * dx + dy * dy);
            const currentRotation = Math.atan2(dy, dx);
            
            // 缩放逻辑(基于比例,更自然)
            const scaleRatio = currentDistance / touchStartDistance;
            state.scale = Math.max(0.1, Math.min(2, lastScale * scaleRatio));
            
            // 旋转逻辑(处理角度跳变)
            let rotationDelta = (currentRotation - touchStartRotation) * (180 / Math.PI);
            // 处理角度跳变
            if (rotationDelta > 180) rotationDelta -= 360;
            if (rotationDelta < -180) rotationDelta += 360;
            
            state.rotation = lastRotation + rotationDelta;
            
            updateTransform();
            
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                // 手势结束,可以添加额外逻辑
            }
        }, { passive: false });

        // === 5. 初始化提示 ===
        setTimeout(() => {
            if (!state.isMarkerFound && status) {
                status.textContent = '💡 扫描识别图开始体验';
            }
        }, 3000);
        
        // === 6. 测试按钮(调试用) ===
        console.log('AR脚本已加载,等待A-Frame场景初始化...');
    </script>
</body>
</html>
